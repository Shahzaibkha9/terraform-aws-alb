compact: true
quiet: true
framework:
  - terraform

# Examples are demonstration configs - not production hardened.
# Strict security checks run only on the module root.
skip-path:
  - examples/

skip-check:
  - CKV_AWS_2     # HTTP listeners are enforced by precondition to redirect only — plain HTTP forwarding is rejected at plan time
  - CKV_AWS_103   # ssl_policy defaults to ELBSecurityPolicy-TLS13-1-2-2021-06; insecure TLS 1.0/1.1 policies rejected by precondition
  - CKV_AWS_91    # access_logs_bucket enables logging; omitting it is valid for non-production use — callers must supply a bucket with ELB delivery permissions
  - CKV2_AWS_76   # WAF WebACL rule group contents (including Log4j AMR) are the caller's responsibility; module only associates the ACL
