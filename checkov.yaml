compact: true
quiet: true
framework:
  - terraform

# Examples are demonstration configs - not production hardened.
# Strict security checks run only on the module root.
skip-path:
  - examples/

skip-check:
  - CKV_AWS_2     # HTTP listeners are intentional for HTTP→HTTPS redirect; HTTPS is enforced at the HTTPS listener
  - CKV_AWS_103   # ssl_policy defaults to ELBSecurityPolicy-TLS13-1-2-2021-06 (TLS 1.2+); HTTP listeners have no ssl_policy by design
  - CKV_AWS_91    # Access logging is configurable via access_logs_bucket; enforcement is the caller's responsibility
  - CKV2_AWS_76   # WAF WebACL rule group contents are the caller's responsibility; module only associates the ACL
